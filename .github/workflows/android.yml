name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Organize Project Files
      run: |
        FOUND_DIR=$(find . -maxdepth 3 -name "settings.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
        if [ -n "$FOUND_DIR" ] && [ "$FOUND_DIR" != "." ]; then
          echo "Moving files from $FOUND_DIR to root..."
          cp -r $FOUND_DIR/* . 2>/dev/null || true
          cp -r $FOUND_DIR/.* . 2>/dev/null || true
        fi
        mkdir -p app
        touch app/proguard-rules.pro

    - name: Accept Licenses and Generate Wrapper
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        gradle wrapper --gradle-version 8.2

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SecurityApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
